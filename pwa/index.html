<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a37">
  <title>소방 항공정비 문제은행</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="precache.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="go" data-view="home" aria-label="홈">
      <img src="icons/icon-192.png" alt="" width="32" height="32">
      <span>항공정비 문제은행</span>
    </button>
    <nav class="tabs" aria-label="메뉴">
      <button data-action="go" data-view="home">학습</button>
      <button data-action="go" data-view="wrong">오답노트</button>
      <button data-action="go" data-view="records">기록</button>
      <button data-action="go" data-view="settings">설정</button>
    </nav>
  </header>
  <div id="statusbar" class="statusbar" aria-live="polite"></div>
  <div id="update-banner" class="banner" hidden>
    새 버전이 준비되었습니다. 풀이 기록은 그대로 유지됩니다.
    <button class="btn small dark" data-action="apply-update">지금 적용</button>
  </div>
  <main id="app"><p class="loading">불러오는 중…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
